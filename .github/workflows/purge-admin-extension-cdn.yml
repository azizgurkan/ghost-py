name: Purge admin extension CDN

on:
  push:
    branches: [main]
    paths:
      - 'pratikye/admin/pratikye-admin.js'
      - 'pratikye/admin/pratikye-admin.css'

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr admin extension assets
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for asset in pratikye/admin/pratikye-admin.js pratikye/admin/pratikye-admin.css; do
            echo "Purging https://cdn.jsdelivr.net/gh/${REPOSITORY}@main/${asset}"
            curl --fail --retry 3 --silent --show-error \
              "https://purge.jsdelivr.net/gh/${REPOSITORY}@main/${asset}"
            echo
          done
